server:
  port: ${PORT:8000}
  servlet:
    context-path: /

spring:
  application:
    name: placementor-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/placementor_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: ${CACHE_TYPE:redis}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: placementor-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:PlacementorSuperSecretKeyThatIsAtLeast256BitsLongForJWTSigning123456}
  expiration: 86400000 # 24 hours in ms

gemini:
  api:
    key: ${GEMINI_API_KEY:your_gemini_api_key_here}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

kafka:
  enabled: ${KAFKA_ENABLED:true}
  topic:
    interview-questions: interview-questions-topic
    interview-feedback: interview-feedback-topic
